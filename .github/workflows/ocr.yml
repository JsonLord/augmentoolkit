name: Hybrid OCR offline tests
on:
  push:
    paths: ['ocr/**', 'pytest-ocr.ini', '.github/workflows/ocr.yml']
  pull_request:
    paths: ['ocr/**', 'pytest-ocr.ini', '.github/workflows/ocr.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --require-hashes -r ocr/requirements.lock
      - run: python -m pip install pytest==9.1.1 pytest-asyncio==1.4.0
      - run: python -m pytest -c pytest-ocr.ini
