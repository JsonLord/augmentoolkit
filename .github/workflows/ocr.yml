name: Hybrid OCR offline tests
on: [push, pull_request]
defaults:
  run:
    shell: bash
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --require-hashes -r ocr/requirements.lock
      - run: python -m pip install -r ocr/requirements-dev.txt
      - run: ruff check ocr augmentoolkit/utils/offline_chunking.py
      - run: ruff format --check ocr augmentoolkit/utils/offline_chunking.py
      - run: python -m pytest -c pytest-ocr.ini 2>&1 | tee /tmp/gate04-ocr-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OCR-test-log
          path: /tmp/gate04-ocr-tests.log
