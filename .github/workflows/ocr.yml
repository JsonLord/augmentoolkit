name: Hybrid OCR offline tests
on:
  push:
    paths: ['ocr/**', 'augmentoolkit/utils/offline_chunking.py', 'generation/core_components/chunking.py', 'pytest-ocr.ini', '.github/workflows/ocr.yml']
  pull_request:
    paths: ['ocr/**', 'augmentoolkit/utils/offline_chunking.py', 'generation/core_components/chunking.py', 'pytest-ocr.ini', '.github/workflows/ocr.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --require-hashes -r ocr/requirements.lock
      - run: python -m pip install -r ocr/requirements-dev.txt
      - run: ruff check ocr augmentoolkit/utils/offline_chunking.py
      - run: ruff format --check ocr augmentoolkit/utils/offline_chunking.py
      - run: python -m pytest -c pytest-ocr.ini
